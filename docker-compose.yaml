version: "3.9"

services:

  backend:
    build:
      context: .
      dockerfile: web/backend/Dockerfile

    container_name: preferans_backend

    ports:
      - "8000:8000"

    volumes:
      - .:/app

    working_dir: /app

    command: >
      uvicorn web.backend.main:app
      --host 0.0.0.0
      --port 8000
      --reload

  frontend:
    build:
      context: .
      dockerfile: web/frontend/Dockerfile

    container_name: preferans_frontend

    ports:
      - "5173:5173"

    volumes:
      - ./web/frontend:/frontend

    command: >
      npm run dev -- --host

    depends_on:
      - backend